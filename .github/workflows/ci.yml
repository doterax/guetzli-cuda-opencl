name: CI

on:
  pull_request:
    branches: [main, master, develop, refactor/modern-cpp]
  push:
    branches: [main, master, refactor/modern-cpp]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting of host C++ (.clang-format; .clang-format-ignore lists the exclusions).
  # clang-format is pinned: other versions format differently.
  format:
    runs-on: ubuntu-latest
    name: clang-format
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting (clang-format 21.1.5)
        run: |
          pipx run clang-format==21.1.5 --version
          git ls-files '*.cc' '*.cpp' '*.h' | xargs pipx run clang-format==21.1.5 --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — OpenCL only
          - os: ubuntu-24.04
            name: linux-opencl
            preset: ci-linux
            features: "OPENCL FULL_JPEG"
            cuda: false
            opencl: true
            shell: bash

          # Linux — CUDA + OpenCL
          - os: ubuntu-24.04
            name: linux-full
            preset: ci-linux
            features: "CUDA OPENCL FULL_JPEG"
            cuda: true
            opencl: true
            shell: bash

          # Windows — CUDA + OpenCL (runtime auto-detects available GPU)
          - os: windows-2022
            name: win-full
            preset: ci-windows-mingw
            features: "CUDA OPENCL FULL_JPEG"
            cuda: true
            opencl: true
            shell: msys2 {0}

          # macOS — OpenCL (Apple framework)
          - os: macos-14
            name: macos-opencl
            preset: ci-macos
            features: "OPENCL FULL_JPEG"
            cuda: false
            opencl: true
            shell: bash

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. MSYS2 setup (Windows only)
      # ------------------------------------------------------------------
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            make
            python3

      # ------------------------------------------------------------------
      # 3. Cache external dependencies
      # ------------------------------------------------------------------
      - name: Cache external deps
        uses: actions/cache@v4
        id: ext-cache
        with:
          path: external/install
          key: ext-${{ runner.os }}-${{ hashFiles('external/CMakeLists.txt') }}

      # ------------------------------------------------------------------
      # 4. Install system packages — Linux
      # ------------------------------------------------------------------
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 pkg-config
          if [ "${{ matrix.opencl }}" = "true" ]; then
            sudo apt-get install -y opencl-headers ocl-icd-opencl-dev ocl-icd-libopencl1 pocl-opencl-icd
          fi

      # ------------------------------------------------------------------
      # 5. Install system packages — macOS
      # ------------------------------------------------------------------
      - name: Install packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config python3

      # ------------------------------------------------------------------
      # 6. Install CUDA Toolkit (conditional)
      #    Only for the cuda.h driver-API header: nvcc is NOT used here. The
      #    embedded PTX (clguetzli/clguetzli_cu_ptx.h) is generated locally with
      #    the pinned toolkit and committed (`make cuda-headers`, see
      #    docs/design/modernization.md section 7 and issue #15).
      # ------------------------------------------------------------------
      - name: Install CUDA
        if: matrix.cuda && runner.os != 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install CUDA (Windows)
        if: matrix.cuda && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      # ------------------------------------------------------------------
      # 7. Build external dependencies (if not cached)
      # ------------------------------------------------------------------
      - name: Build external dependencies
        if: steps.ext-cache.outputs.cache-hit != 'true'
        run: |
          cd external
          extra_args=""
          # macOS uses Apple's OpenCL.framework — skip Khronos ICD Loader
          if [ "$(uname -s)" = "Darwin" ]; then
            extra_args="-DBUILD_OPENCL=OFF"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                $extra_args
          cmake --build build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      # ------------------------------------------------------------------
      # 8. Build guetzli
      # ------------------------------------------------------------------
      # Expose CUDA include/lib to MSYS2 shell (paths from Jimver/cuda-toolkit)
      - name: Configure CUDA env (Windows)
        if: runner.os == 'Windows' && matrix.cuda
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          echo "CPLUS_INCLUDE_PATH=$CUDA_PATH/include" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=$CUDA_PATH/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$CUDA_PATH/lib/x64" >> $GITHUB_ENV

      - name: Configure (CMake)
        run: |
          # The CUDA backend needs only cuda.h (driver API, loaded at runtime).
          # Linux runs the smoke test without --c so pocl exercises the OpenCL path.
          cmake --preset ${{ matrix.preset }}             -DGUETZLI_WITH_CUDA=${{ matrix.cuda && 'ON' || 'OFF' }}             -DGUETZLI_WITH_OPENCL=${{ matrix.opencl && 'ON' || 'OFF' }}             ${{ runner.os == 'Linux' && '-DGUETZLI_SMOKE_FLAGS=' || '' }}

      - name: Build guetzli
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: Unit and smoke tests
        run: |
          ctest --preset ${{ matrix.preset }}

      # The embedded kernel headers are committed; CI must never regenerate them.
      - name: Verify embedded kernel headers
        run: |
          cmake --build --preset ${{ matrix.preset }} --target check-kernel-headers

      - name: Verify the build did not modify committed kernel headers
        shell: bash
        run: |
          git diff --exit-code -- clguetzli/clguetzli_cu_ptx.h clguetzli/clguetzli_cl_src.h

      # ------------------------------------------------------------------
      # 9. Binary diagnostics
      # ------------------------------------------------------------------
      - name: Binary diagnostics
        if: runner.os != 'Windows'
        run: |
          BIN="build/${{ matrix.preset }}/bin/guetzli"
          echo "--- file ---"
          file "$BIN"
          echo "--- otool -L / ldd ---"
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BIN"
          else
            ldd "$BIN" || true
          fi
          echo "--- quick smoke ---"
          "$BIN" --version 2>&1 || echo "exit code: $?"

      - name: Binary diagnostics (Windows)
        if: runner.os == 'Windows'
        run: |
          BIN="build/${{ matrix.preset }}/bin/guetzli.exe"
          echo "--- DLL dependencies ---"
          objdump -p "$BIN" | grep "DLL Name" || true
          echo "--- quick smoke ---"
          "$BIN" --version 2>&1 || echo "exit code: $?"

      # ------------------------------------------------------------------
      # 11. Package artifact
      # ------------------------------------------------------------------
      - name: Package artifact
        run: |
          mkdir -p dist
          cp "build/${{ matrix.preset }}/bin/guetzli${{ runner.os == 'Windows' && '.exe' || '' }}" dist/
          cp README.md LICENSE dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guetzli-${{ matrix.name }}
          path: dist/

  # ====================================================================
  # Release job — runs only on v* tags after all builds pass
  # ====================================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release archives
        run: |
          cd artifacts
          # Linux
          if [ -d guetzli-linux-full ]; then
            tar czf ../guetzli-cuda-opencl-linux-x64.tar.gz -C guetzli-linux-full .
          elif [ -d guetzli-linux-opencl ]; then
            tar czf ../guetzli-cuda-opencl-linux-x64.tar.gz -C guetzli-linux-opencl .
          fi
          # Windows
          if [ -d guetzli-win-full ]; then
            (cd guetzli-win-full && zip -r ../../guetzli-cuda-opencl-win-x64.zip .)
          fi
          # macOS
          if [ -d guetzli-macos-opencl ]; then
            tar czf ../guetzli-cuda-opencl-macos-arm64.tar.gz -C guetzli-macos-opencl .
          fi
          cd ..
          ls -la *.tar.gz *.zip 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            guetzli-cuda-opencl-linux-x64.tar.gz
            guetzli-cuda-opencl-win-x64.zip
            guetzli-cuda-opencl-macos-arm64.tar.gz
