name: CI

on:
  pull_request:
    branches: [main, master, develop, refactor/modern-cpp]
  push:
    branches: [main, master, refactor/modern-cpp]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting of host C++ (.clang-format; .clang-format-ignore lists the exclusions).
  # clang-format is pinned: other versions format differently.
  format:
    runs-on: ubuntu-24.04
    name: clang-format
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting (clang-format 21.1.5)
        run: |
          pipx run clang-format==21.1.5 --version
          git ls-files '*.cc' '*.cpp' '*.h' | xargs pipx run clang-format==21.1.5 --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — OpenCL only
          - os: ubuntu-24.04
            name: linux-opencl
            preset: ci-linux
            features: "OPENCL FULL_JPEG"
            cuda: false
            opencl: true
            shell: bash

          # Linux — CUDA + OpenCL
          - os: ubuntu-24.04
            name: linux-full
            preset: ci-linux
            features: "CUDA OPENCL FULL_JPEG"
            cuda: true
            opencl: true
            shell: bash

          # Linux — AddressSanitizer + LeakSanitizer on the CPU path (unit tests, smoke test with --c,
          # injected GPU failures). Both GPU backends are compiled in; no artifact.
          - os: ubuntu-24.04
            name: linux-asan
            preset: ci-linux-asan
            features: "CUDA OPENCL FULL_JPEG"
            cuda: true
            opencl: true
            sanitize: true
            shell: bash

          # Windows — CUDA + OpenCL (runtime auto-detects available GPU)
          - os: windows-2022
            name: win-full
            preset: ci-windows-mingw
            features: "CUDA OPENCL FULL_JPEG"
            cuda: true
            opencl: true
            shell: msys2 {0}

          # macOS — OpenCL (Apple framework)
          - os: macos-26
            name: macos-opencl
            preset: ci-macos
            features: "OPENCL FULL_JPEG"
            cuda: false
            opencl: true
            shell: bash

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # 2. MSYS2 setup (Windows only)
      # ------------------------------------------------------------------
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config

      # ------------------------------------------------------------------
      # 3. Cache external dependencies
      # ------------------------------------------------------------------
      - name: Cache external deps
        uses: actions/cache@v5
        id: ext-cache
        with:
          path: external/install
          key: ext-v2-${{ runner.os }}-${{ hashFiles('external/CMakeLists.txt') }}

      # ------------------------------------------------------------------
      # 4. Install system packages — Linux
      # ------------------------------------------------------------------
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
          if [ "${{ matrix.opencl }}" = "true" ]; then
            sudo apt-get install -y opencl-headers ocl-icd-opencl-dev ocl-icd-libopencl1 pocl-opencl-icd
          fi

      # ------------------------------------------------------------------
      # 5. Install system packages — macOS
      # ------------------------------------------------------------------
      - name: Install packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      # ------------------------------------------------------------------
      # 6. Install CUDA Toolkit (conditional)
      #    Only for the cuda.h driver-API header: nvcc is NOT used here. The
      #    embedded fatbin (kernels/guetzli_cu_fatbin.h) is generated locally with
      #    the pinned toolkit and committed (`kernel-headers` target, see
      #    docs/design/modernization.md section 7 and issue #15).
      # ------------------------------------------------------------------
      - name: Install CUDA
        if: matrix.cuda && runner.os != 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install CUDA (Windows)
        if: matrix.cuda && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      # ------------------------------------------------------------------
      # 7. Build external dependencies (if not cached)
      # ------------------------------------------------------------------
      - name: Build external dependencies
        if: steps.ext-cache.outputs.cache-hit != 'true'
        run: |
          cd external
          extra_args=""
          # macOS uses Apple's OpenCL.framework — skip Khronos ICD Loader
          if [ "$(uname -s)" = "Darwin" ]; then
            extra_args="-DBUILD_OPENCL=OFF"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                $extra_args
          cmake --build build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      # ------------------------------------------------------------------
      # 8. Build guetzli
      # ------------------------------------------------------------------
      # Expose CUDA include/lib to MSYS2 shell (paths from Jimver/cuda-toolkit)
      - name: Configure CUDA env (Windows)
        if: runner.os == 'Windows' && matrix.cuda
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          echo "CPLUS_INCLUDE_PATH=$CUDA_PATH/include" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=$CUDA_PATH/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$CUDA_PATH/lib/x64" >> $GITHUB_ENV

      - name: Configure (CMake)
        run: |
          # The CUDA backend needs only cuda.h (driver API, loaded at runtime).
          # Linux runs the smoke test without --c so pocl exercises the OpenCL path.
          cmake --preset ${{ matrix.preset }}             -DGUETZLI_WITH_CUDA=${{ matrix.cuda && 'ON' || 'OFF' }}             -DGUETZLI_WITH_OPENCL=${{ matrix.opencl && 'ON' || 'OFF' }}             ${{ runner.os == 'Linux' && !matrix.sanitize && '-DGUETZLI_SMOKE_FLAGS=' || '' }}

      # Compiler errors and warnings also become annotations (visible on the run page and via the API).
      - name: Build guetzli
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log || {
            grep -E 'error|warning' build.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Unit and smoke tests
        run: |
          ctest --preset ${{ matrix.preset }}

      - name: Sanitized runs with an injected GPU failure (CPU fallback)
        if: matrix.sanitize
        run: |
          BIN="build/${{ matrix.preset }}/bin/guetzli"
          for backend in --opencl --cuda; do
            GUETZLI_TEST_GPU_FAIL=1 "$BIN" $backend tests/regress/input/rgb_150x118.png "$RUNNER_TEMP/out.jpg"
            GUETZLI_TEST_GPU_FAIL=1 "$BIN" $backend tests/regress/input/yuv420_150x118.jpg "$RUNNER_TEMP/out.jpg"
          done

      # Static analysis (.clang-tidy). The linux-full job builds both GPU backends, so it sees the most
      # code; clang-tidy is pinned like clang-format (other versions report differently).
      - name: clang-tidy (21.1.6)
        if: matrix.name == 'linux-full'
        run: |
          pipx install clang-tidy==21.1.6
          clang-tidy --version
          set -o pipefail
          git ls-files 'app/*.cpp' 'backend/*.cpp' 'config/*.cpp' 'core/*.cpp' 'kernels/*.cpp' 'logging/*.cpp' \
                       'tests/unit/*.cpp' \
            | xargs -P "$(nproc)" -n 1 clang-tidy -p "build/${{ matrix.preset }}" --quiet --warnings-as-errors='*' \
            2>&1 | tee tidy.log || {
              # One annotation per finding (file:line: message [check]), deduplicated across files.
              grep -E '(warning|error): ' tidy.log | sed "s|^$GITHUB_WORKSPACE/||" | sort -u | head -40 \
                | while IFS= read -r line; do echo "::error::${line}"; done
              exit 1
            }

      # The embedded kernel headers are committed; CI must never regenerate them.
      - name: Verify embedded kernel headers
        run: |
          cmake --build --preset ${{ matrix.preset }} --target check-kernel-headers

      - name: Verify the build did not modify committed kernel headers
        shell: bash
        run: |
          git diff --exit-code -- kernels/guetzli_cu_fatbin.h kernels/guetzli_cu_info.h kernels/guetzli_cl_src.h

      # ------------------------------------------------------------------
      # 9. Binary diagnostics
      # ------------------------------------------------------------------
      - name: Binary diagnostics
        if: runner.os != 'Windows'
        run: |
          BIN="build/${{ matrix.preset }}/bin/guetzli"
          echo "--- file ---"
          file "$BIN"
          echo "--- otool -L / ldd ---"
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BIN"
          else
            ldd "$BIN" || true
          fi
          echo "--- quick smoke ---"
          "$BIN" --version 2>&1 || echo "exit code: $?"

      - name: Binary diagnostics (Windows)
        if: runner.os == 'Windows'
        run: |
          BIN="build/${{ matrix.preset }}/bin/guetzli.exe"
          echo "--- DLL dependencies ---"
          objdump -p "$BIN" | grep "DLL Name" || true
          # The release must start on a clean Windows 10/11: only system DLLs and the UCRT may be imported
          # (nvcuda.dll is loaded at runtime; the OpenCL ICD loader is linked statically).
          extra=$(objdump -p "$BIN" | sed -n 's/.*DLL Name: //p' | tr 'A-Z' 'a-z' \
                  | grep -v -E '^(kernel32|advapi32|cfgmgr32|ole32|user32|shell32|ws2_32|bcrypt|api-ms-win-crt-.*)\.dll$' || true)
          if [ -n "$extra" ]; then
            for dll in $extra; do echo "::error::guetzli.exe imports a non-system DLL: $dll"; done
            exit 1
          fi
          echo "--- quick smoke ---"
          "$BIN" --version 2>&1 || echo "exit code: $?"

      # ------------------------------------------------------------------
      # 11. Package artifact
      # ------------------------------------------------------------------
      - name: Package artifact
        if: ${{ !matrix.sanitize }}
        run: |
          mkdir -p dist
          cp "build/${{ matrix.preset }}/bin/guetzli${{ runner.os == 'Windows' && '.exe' || '' }}" dist/
          cp README.md LICENSE dist/ 2>/dev/null || true

      - name: Upload artifact
        if: ${{ !matrix.sanitize }}
        uses: actions/upload-artifact@v6
        with:
          name: guetzli-${{ matrix.name }}
          path: dist/

  # ====================================================================
  # Release job — runs only on v* tags after all builds pass
  # ====================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Package release archives
        run: |
          cd artifacts
          # Linux
          if [ -d guetzli-linux-full ]; then
            tar czf ../guetzli-cuda-opencl-linux-x64.tar.gz -C guetzli-linux-full .
          elif [ -d guetzli-linux-opencl ]; then
            tar czf ../guetzli-cuda-opencl-linux-x64.tar.gz -C guetzli-linux-opencl .
          fi
          # Windows
          if [ -d guetzli-win-full ]; then
            (cd guetzli-win-full && zip -r ../../guetzli-cuda-opencl-win-x64.zip .)
          fi
          # macOS
          if [ -d guetzli-macos-opencl ]; then
            tar czf ../guetzli-cuda-opencl-macos-arm64.tar.gz -C guetzli-macos-opencl .
          fi
          cd ..
          ls -la *.tar.gz *.zip 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            guetzli-cuda-opencl-linux-x64.tar.gz
            guetzli-cuda-opencl-win-x64.zip
            guetzli-cuda-opencl-macos-arm64.tar.gz
